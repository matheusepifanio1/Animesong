name: ranking
# Gera a lista das franquias na ordem usada pelas faixas de dificuldade e salva no branch "ranking".
on:
  workflow_dispatch:
  push:
    branches: [ranking-run]
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p out && node generator/generate.mjs --state none.json --out out --list 500 --days 0
      - run: |
          cd out && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout -q -b ranking && git add ranking.txt && git commit -qm "ranking ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ranking
