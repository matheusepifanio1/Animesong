name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm view wrangler time --json | grep -E '"4\.1[2-5][0-9]\.[0-9]+"' > probe-out.txt
          git init -q . && git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout -q --orphan probe-out && git add probe-out.txt && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
