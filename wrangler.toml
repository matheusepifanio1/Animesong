name = "opdle"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# O id é preenchido automaticamente pelo workflow (.github/workflows/opdle.yml)
[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID"

# Banco de resultados, estatísticas e grupos (Durable Object com SQLite, plano grátis)
[[durable_objects.bindings]]
name = "DB"
class_name = "OpdleDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpdleDB"]
